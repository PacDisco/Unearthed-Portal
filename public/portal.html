<style>
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f9f8f2;
    color: #231f20;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 50px 20px 30px;
    background: #000000;
    color: white;
  }

  header h1 {
    font-size: 22px;
    letter-spacing: 2px;
    margin: 0;
  }

  header p {
    font-size: 13px;
    opacity: 0.7;
    margin-top: 8px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 40px;
    max-width: 1000px;
    margin: auto;
  }

  /* TILE BASE */
  .tile {
    background: white;
    border: 1px solid #e2decf;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 12px;
    letter-spacing: 1.5px;
  }

  .tile:hover {
    transform: translateY(-4px);
    border-color: #59a1aa;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  }

  /* TILE ACCENTS */
  .tile.teal {
    border-top: 4px solid #59a1aa;
  }

  .tile.olive {
    border-top: 4px solid #a9a66e;
  }

  .tile.sand {
    border-top: 4px solid #d6a380;
  }

  .tile.blue {
    border-top: 4px solid #aed1db;
  }

  /* CONTENT */
  #content {
    max-width: 900px;
    margin: 20px auto 60px;
    padding: 40px;
    background: white;
    border: 1px solid #e2decf;
    line-height: 1.7;
  }

  iframe {
    border: none;
    margin-top: 30px;
    width: 100%;
    height: 600px;
  }

  a {
    color: #59a1aa;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
