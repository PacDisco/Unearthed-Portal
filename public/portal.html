<!DOCTYPE html>
<html>
<head>
  <title>Portal</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    /* HEADER */
    header {
      background: #000;
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 5px;
      font-size: 14px;
      opacity: 0.7;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }

    /* TILE */
    .tile {
      background: #dcdcdc;
      border-radius: 6px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .tile:hover {
      background: #c9c9c9;
      transform: translateY(-3px);
    }

    /* CONTENT */
    #content {
      max-width: 900px;
      margin: 20px auto 40px;
      padding: 30px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    iframe {
      border: none;
      margin-top: 20px;
      width: 100%;
      height: 600px;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .tile {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1 id="title">LOADING...</h1>
  <p>Student Portal</p>
</header>

<div class="grid">

  <div class="tile" onclick="loadSection('trip_information_content')">
    TRIP INFORMATION
  </div>

  <div class="tile" onclick="loadSection('destination_overview_content')">
    DESTINATION OVERVIEW
  </div>

  <div class="tile" onclick="loadSection('travel_information_content')">
    TRAVEL INFORMATION
  </div>

  <div class="tile" onclick="loadSection('general_information_content')">
    GENERAL INFO
  </div>

  <div id="familyTile" class="tile" onclick="loadSection('family_information_content')">
    FAMILY AREA
  </div>

  <div id="paymentsTile" class="tile" onclick="loadSection('payments_information_content')">
    PAYMENTS
  </div>

</div>

<div id="content"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email");

  let portalData = {};

  async function init() {
    const res = await fetch(`/.netlify/functions/portal?email=${email}`);
    const data = await res.json();

    console.log("PORTAL DATA:", data);

    if (data.error) {
      document.body.innerHTML = `<h1>${data.error}</h1>`;
      return;
    }

    portalData = data;

    document.getElementById("title").innerText =
      portalData.portal_title || "PORTAL";

    applyVisibility(portalData.labels);

    loadSection("trip_information_content");
  }

  function loadSection(field) {
    let html = portalData[field] || "No content available";

    if (field === "payments_information_content" && portalData.payments_form_url) {
      html += `
        <iframe src="${portalData.payments_form_url}"></iframe>
      `;
    }

    document.getElementById("content").innerHTML = html;
  }

  function applyVisibility(labels) {
    console.log("LABELS:", labels);

    if (!labels.includes("parent")) {
      document.getElementById("familyTile").style.display = "none";
    }

    if (!labels.includes("parent") && !labels.includes("student")) {
      document.getElementById("paymentsTile").style.display = "none";
    }
  }

  init();
</script>

</body>
</html>
