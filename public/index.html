<!DOCTYPE html>
<html>
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2d6b74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Unearthed">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/icon-192.png">

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Unearthed Education" />
<link rel="manifest" href="/site.webmanifest" />
  
  <title>Unearthed Eduaction Portal</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f9f8f2;
      color: #231f20;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 50px 20px 30px;
      background: #2d6b74;
      color: white;
    }

    header h1 {
      font-size: 22px;
      letter-spacing: 2px;
      margin: 0;
    }

    header p {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 8px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 24px;
      max-width: 1000px;
      margin: auto;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 16px;
      }

      .tile {
        padding: 28px 12px;
        font-size: 11px;
        letter-spacing: 1px;
      }

      #content {
        margin: 8px 12px 40px;
        padding: 20px;
      }

      header {
        padding: 30px 20px 20px;
      }

      header h1 {
        font-size: 18px;
      }
    }
    /* TILE */
    .tile {
      background: white;
      border: 1px solid #e2decf;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 12px;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    .tile:hover {
      transform: translateY(-4px);
      border-color: #59a1aa;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    /* TILE ACCENTS */
    .tile.teal { border-top: 4px solid #59a1aa; }
    .tile.blue { border-top: 4px solid #aed1db; }
    .tile.olive { border-top: 4px solid #a9a66e; }
    .tile.sand { border-top: 4px solid #d6a380; }

    /* CONTENT */
    #content {
      max-width: 900px;
      margin: 20px auto 60px;
      padding: 40px;
      background: white;
      border: 1px solid #e2decf;
      line-height: 1.7;
      transition: opacity 0.2s ease;
    }

    iframe {
      display: block;
      border: none;
      margin-top: 30px;
      width: 100% !important;
      min-height: 400px;
    }

    a {
      color: #59a1aa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* PORTAL BUTTONS */
    .portal-btn {
  display: inline-block !important;
  margin: 8px 8px 8px 0;
  padding: 16px 32px !important;
  border-radius: 6px;
  color: white !important;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none !important;
  letter-spacing: 0.5px;
  transition: opacity 0.2s ease;
  cursor: pointer;
}

    .portal-btn:hover {
      opacity: 0.85;
      text-decoration: none !important;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .grid {
        padding: 20px;
      }

      #content {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1 id="title">UNEARTHED</h1>
  <p>STUDENT PORTAL</p>
</header>

<div class="grid">

  <div class="tile teal" onclick="loadSection('trip_information_content')">
    TRIP INFORMATION
  </div>

  <div class="tile blue" onclick="loadSection('destination_overview_content')">
    DESTINATION OVERVIEW
  </div>

  <div class="tile olive" onclick="loadSection('travel_information_content')">
    TRAVEL INFORMATION
  </div>

  <div class="tile sand" onclick="loadSection('general_information_content')">
    GENERAL INFORMATION
  </div>

  <div id="familyTile" class="tile olive" onclick="loadSection('family_information_content')">
    FAMILY AREA
  </div>

  <div id="paymentsTile" class="tile sand" onclick="loadSection('payments_information_content')">
    PAYMENTS
  </div>

  <div id="tripLeaderTile" class="tile teal" onclick="loadSection('trip_leader_information_content')">
    TRIP LEADER
  </div>

  <div id="teacherTile" class="tile blue" onclick="loadSection('teacher_information_content')">
    TEACHER
  </div>

</div>

<div id="content">Loading...</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email");

  let portalData = {};

  async function init() {
    try {
      const res = await fetch(`/.netlify/functions/portal?email=${email}`);
      const data = await res.json();

      console.log("PORTAL DATA:", data);

      if (data.error) {
        document.body.innerHTML = `<h1>${data.error}</h1>`;
        return;
      }

      portalData = data;

      document.getElementById("title").innerText =
        portalData.portal_title || "UNEARTHED";

      applyVisibility(portalData.labels);

      loadSection("trip_information_content");

    } catch (err) {
      document.body.innerHTML = `<h1>Error loading portal</h1>`;
    }
  }

  function loadSection(field) {
    const content = document.getElementById("content");

    content.style.opacity = 0;

    setTimeout(() => {
      let html = portalData[field] || "No content available";

      if (field === "payments_information_content" && portalData.payments_form_url) {
        html += `<iframe src="${portalData.payments_form_url}"></iframe>`;
      }

      content.innerHTML = html;
      content.style.opacity = 1;

      styleLinksAsButtons();
    }, 100);
  }

  function styleLinksAsButtons() {
    const links = document.querySelectorAll("#content a");
    const colors = ["#5b7f9e", "#59a1aa", "#a9a66e", "#d6a380"];

    links.forEach((link, index) => {
      link.classList.add("portal-btn");
      if (index === 0) {
        link.style.background = "#e8694a";
      } else {
        link.style.background = colors[(index - 1) % colors.length];
      }
    });
  }

  function applyVisibility(labels = []) {
    console.log("LABELS:", labels);

    if (!labels.includes("Parent")) {
      document.getElementById("familyTile").style.display = "none";
    }

    if (!labels.includes("Parent") && !labels.includes("Student")) {
      document.getElementById("paymentsTile").style.display = "none";
    }

    if (!labels.includes("Trip_Leader")) {
      document.getElementById("tripLeaderTile").style.display = "none";
    }

    if (!labels.includes("Teacher")) {
      document.getElementById("teacherTile").style.display = "none";
    }
  }

  init();
  
  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}
</script>

</body>
</html>
