            ? `<div class="leader-card-contact"><a href="mailto:${attrEsc(a.email)}">${attrEsc(a.email)}</a></div>`
            : "",
          bioHtml
        });
      });

      // School leaders (HubSpot association label "Teacher") — full contact
      // card with optional headshot photo at top.
      teachers.forEach(t => {
        grid.innerHTML += renderLeaderCard({
          variant: "school-leader",
          roleLabel: "SCHOOL LEADER",
          name: t.name,
          photoUrl: t.photoUrl,
          contactHtml: `
            <div class="leader-card-contact">
              ${t.email ? `<a href="mailto:${attrEsc(t.email)}">${attrEsc(t.email)}</a><br>` : ""}
              ${t.phone ? `<a href="tel:${attrEsc(t.phone)}">${attrEsc(t.phone)}</a>` : ""}
            </div>`,
          bioHtml: ""
        });
      });

      // Expedition leaders (HubSpot association label "Trip Leader") — name +
      // bio only (no email/phone exposed in the parent-facing view).
      tripLeaders.forEach(l => {
        const bioHtml = l.bio ? applyTextBreaks(l.bio) : "";
        grid.innerHTML += renderLeaderCard({
          variant: "expedition-leader",
          roleLabel: "EXPEDITION LEADER",
          name: l.name,
          photoUrl: l.photoUrl,
          contactHtml: "",
          bioHtml
        });
      });

      section.appendChild(grid);
      content.appendChild(section);

      // After the grid is in the DOM, decide which bios actually overflow
      // their clamp and need a "Read more" toggle. Done as a post-render
      // pass because we need real layout heights.
      wireLeaderCardReadMore(section);

    } catch (err) {
      console.error("Teacher load error:", err);
    }
  }

  // Fallback shown inside the leader-card photo circle when a contact has
  // no expedition_leader_photo configured (or the configured one fails to
  // load). The asset lives in the EDA Group HubSpot file manager so it
  // stays under our control and isn't subject to third-party CDN hotlink
  // or CORS quirks. Update this constant if the file is ever re-uploaded
  // (HubSpot file URLs change when you re-upload rather than overwrite).
  const LEADER_PHOTO_FALLBACK_URL = "https://3855728.fs1.hubspotusercontent-na1.net/hubfs/3855728/EDA%20Group%202025/Unearthed%20Education%202025/Logos/Logo-Landscape-Black.jpg";

  // Renders one school-leader / expedition-leader card. Same markup for
  // both — only the variant class and role label differ — so spacing,
  // photo size, and clamp behaviour stay aligned across the grid.
  //
  // Photo handling, three cascading tiers:
  //   1. If we have a real photoUrl, render it normally.
  //   2. If we don't, OR if (1) errors out, render the Unearthed logo in
  //      the circle with the "is-fallback" modifier (object-fit: contain
  //      and padding, so the wordmark fits inside the circle instead of
  //      being cropped to a slice).
  //   3. If (2) ALSO fails (rare — bad URL, file moved in HubSpot, etc.),
  //      hide the <img> so we end up with just the empty tan circle
  //      rather than a broken-image icon.
  // The same onerror handler is attached in every case so we don't end
  // up with an empty circle when only the third tier was needed.
  function renderLeaderCard({ variant, roleLabel, name, photoUrl, contactHtml, bioHtml }) {
    const fallback = attrEsc(LEADER_PHOTO_FALLBACK_URL);
    const hasPhoto = !!photoUrl;
    const initialSrc = hasPhoto ? attrEsc(photoUrl) : fallback;
    const initialClass = hasPhoto
      ? "leader-card-photo"
      : "leader-card-photo leader-card-photo--fallback";

    // Inline-quoted JS so we can attach the same handler in both cases
    // without templating around the differences. `data-fb` flips to "1"
    // once we've already swapped to the fallback; the second time the
    // handler fires we just hide the image instead of looping.
    const onErrorJs =
      "if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='" + fallback + "';this.classList.add('leader-card-photo--fallback');}" +
      "else{this.onerror=null;this.style.display='none';}";

    const photoHtml = `<img class="${initialClass}"`
      + ` src="${initialSrc}"`
      + ` alt="${attrEsc(name || roleLabel)}"`
      + ` loading="lazy"`
      + ` data-fb="${hasPhoto ? '0' : '1'}"`
      + ` onerror="${onErrorJs}">`;

    return `
      <div class="leader-card leader-card--${variant}">
        ${photoHtml}
        <div class="leader-card-role">${attrEsc(roleLabel)}</div>
        <h4 class="leader-card-name">${attrEsc(name || "Unknown")}</h4>
        ${contactHtml || ""}
        ${bioHtml ? `<div class="leader-card-bio" data-bio><div class="leader-card-bio-inner">${bioHtml}</div></div>` : ""}
      </div>
    `;
  }

  // Post-render pass that walks the cards just rendered and decides which
  // bios actually overflow the clamp. Cards whose bio text fits get nothing
  // extra; cards that overflow get a "Read more" link wired up to expand.
  // We do this after layout because we need real measured heights — there
  // is no reliable CSS-only way to "show toggle only if clamped".
  function wireLeaderCardReadMore(section) {
    const cards = section.querySelectorAll(".leader-card");
    cards.forEach(card => {
      const bio = card.querySelector("[data-bio]");
      if (!bio) return;
      const inner = bio.querySelector(".leader-card-bio-inner");
      if (!inner) return;

      // If the inner content is taller than the clamped wrapper, we need
      // a toggle. A small fudge guards against fractional-pixel false
      // positives in some browsers.
      const overflows = inner.scrollHeight > bio.clientHeight + 2;
      if (!overflows) return;

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "leader-card-readmore";
      toggle.textContent = "Read more";
      toggle.addEventListener("click", () => {
        const expanded = card.classList.toggle("leader-card--expanded");
        toggle.textContent = expanded ? "Read less" : "Read more";
      });
      card.appendChild(toggle);
    });
  }

  async function loadStudentList(content, options = {}) {
    const expandable = !!options.expandable;
    const showAppModal = !!options.applicationModal;

    const loader = document.createElement("div");
    loader.id = "studentLoader";
    loader.style.cssText = "text-align:center; padding:30px; font-size:13px; color:#999; letter-spacing:1px;";
    loader.textContent = "LOADING STUDENTS...";
    content.appendChild(loader);

    try {
      const portalId = portalData.hs_object_id;
      const res = await fetch(`/.netlify/functions/get-students?portalId=${portalId}`);
      const data = await res.json();

      document.getElementById("studentLoader")?.remove();

      if (data.error || !data.students?.length) {
        content.insertAdjacentHTML("beforeend", "<p style='color:#999; font-size:13px; margin-top:20px;'>No students found.</p>");
        return;
      }

      const grid = document.createElement("div");
      grid.className = "student-grid";

      data.students.forEach(student => {
        const paymentsHtml = student.payments.length
          ? student.payments.map(p => `<span>$${parseFloat(p.amount).toLocaleString()}</span>`).join("")
          : "<span>No payments recorded</span>";

        const parentsHtml = student.parents.length
          ? student.parents.map(p => `
              <div class="parent-item">
                <strong>${p.name}</strong><br>
                ${p.email ? `<a href="mailto:${p.email}">${p.email}</a><br>` : ""}
                ${p.phone ? `<a href="tel:${p.phone}">${p.phone}</a>` : ""}
              </div>
            `).join("")
          : "<div class='parent-item' style='color:#999;'>No parents linked</div>";

        let expandBlock = "";
        if (expandable) {
          // Trip leader: button opens the same popup as the teacher tab,
          // but with the focused medical/health/passport/dietary whitelist
          // applied so trip leaders see only the emergency-relevant view.
          expandBlock = `
            <button class="student-expand-btn" type="button"
                    data-email="${attrEsc(student.email || "")}"
                    data-student-name="${attrEsc(student.name || "")}"
                    onclick="openApplicationModal(this.dataset.email, this.dataset.studentName, true)">
              MEDICAL INFORMATION
            </button>
          `;
        } else if (showAppModal) {
          // Teacher tab: opens a modal with the FULL application submission.
          expandBlock = `
            <button class="student-expand-btn" type="button"
                    data-email="${attrEsc(student.email || "")}"
                    data-student-name="${attrEsc(student.name || "")}"
                    onclick="openApplicationModal(this.dataset.email, this.dataset.studentName)">
              APPLICATION INFORMATION
            </button>
          `;
        }

        const photoHtml = student.portraitUrl
          ? `<img class="student-card-photo" src="${attrEsc(student.portraitUrl)}" alt="${attrEsc(student.name || "Student")}" loading="lazy" onerror="this.style.display='none';">`
          : "";

        // Trip-leader cards focus on medical context — hide the student's
        // email + the payment details. Other tabs (teacher) keep them.
        const showStudentEmail = !expandable;
        const showPayments = !expandable;

        const contactInfoHtml = (showStudentEmail && student.email) || student.phone
          ? `<div class="contact-info">
              ${showStudentEmail && student.email ? `<a href="mailto:${attrEsc(student.email)}">${attrEsc(student.email)}</a><br>` : ""}
              ${student.phone ? `<a href="tel:${attrEsc(student.phone)}">${attrEsc(student.phone)}</a>` : ""}
            </div>`
          : "";

        const paymentsBlock = showPayments
          ? `<div class="paid-badge">TOTAL PAID: $${student.totalPaid.toLocaleString()}</div>
             <div class="payments-list">${paymentsHtml}</div>`
          : "";

        // Teachers tab only: surface the school's per-student tracking
        // fields (`ue_student_status` and `notes`) on each card. Hidden on
        // the Trip Leader tab (which is medical-focused) and entirely
        // skipped if both fields are empty so we don't draw an empty box.
        let teacherFieldsBlock = "";
        if (showAppModal) {
          const statusHtml = student.status
            ? `<div class="student-status">
                 <span class="student-status-label">STATUS</span>
                 <span class="student-status-value">${attrEsc(student.status)}</span>
               </div>`
            : "";
          const notesHtml = student.notes
            ? `<div class="student-notes">
                 <div class="student-notes-label">NOTES</div>
                 <div class="student-notes-value">${applyTextBreaks(student.notes)}</div>
               </div>`
            : "";
          if (statusHtml || notesHtml) {
            teacherFieldsBlock = `<div class="student-school-fields">${statusHtml}${notesHtml}</div>`;
          }
        }

        grid.innerHTML += `
          <div class="student-card">
            ${photoHtml}
            <h3>${attrEsc(student.name || "Unknown")}</h3>
            ${contactInfoHtml}
            ${paymentsBlock}
            ${teacherFieldsBlock}
            <div class="parent-section">
              <div class="parent-label">PARENTS / GUARDIANS</div>
              ${parentsHtml}
            </div>
            ${expandBlock}
          </div>
        `;
      });

      content.appendChild(grid);

    } catch (err) {
      document.getElementById("studentLoader")?.remove();
      content.insertAdjacentHTML("beforeend", "<p style='color:#c0392b; font-size:13px; margin-top:20px;'>Error loading students.</p>");
    }
  }

  // Application form labels we want to surface in the trip-leader expansion.
  // Stored as a Set so duplicate labels (the form has three "If you answered

  // Click handler attached to each "VIEW APPLICATION DETAILS" button on a
  // trip-leader student card. Lazily fetches the application data the first
  // time the card is opened, then just toggles visibility on subsequent clicks.
  async function toggleStudentExpand(button) {
    const card = button.closest(".student-card");
    if (!card) return;
    const details = card.querySelector(".student-card-details");
    if (!details) return;

    const isOpen = !details.hasAttribute("hidden");
    if (isOpen) {
      details.setAttribute("hidden", "");
      button.textContent = "VIEW APPLICATION DETAILS";
      return;
    }

    button.textContent = "HIDE APPLICATION DETAILS";
    details.removeAttribute("hidden");

    if (details.dataset.loaded === "true") return;

    const email = details.dataset.email || "";
    if (!email) {
      details.innerHTML = `<div class="application-detail-empty">No email on this student record.</div>`;
      details.dataset.loaded = "true";
      return;
    }

    details.innerHTML = `<div class="application-detail-empty">LOADING APPLICATION DETAILS…</div>`;

    try {
      const res = await fetch(`/.netlify/functions/get-application-data?email=${encodeURIComponent(email)}`);
      const data = await res.json();
      details.innerHTML = renderApplicationDetails(data);
    } catch (err) {
      console.error("Application data fetch error:", err);
      details.innerHTML = `<div class="application-detail-empty">Could not load application details.</div>`;
    }
    details.dataset.loaded = "true";
  }

  function renderApplicationDetails(data) {
    if (!data || data.error) {
      return `<div class="application-detail-empty">Could not load application details${data?.error ? `: ${attrEsc(data.error)}` : ""}.</div>`;
    }
    if (!data.found) {
      return `<div class="application-detail-empty">No application form submission found for this email.</div>`;
    }

    const all = Array.isArray(data.fields) ? data.fields : [];
    const fields = all.filter(f => TRIP_LEADER_APPLICATION_FIELDS.has(f.label));

    let metaHtml = "";
    if (data.submittedAt) {
      const d = new Date(data.submittedAt);
      if (!isNaN(d.getTime())) {
        const when = d.toLocaleDateString("en-NZ", { year: "numeric", month: "short", day: "numeric" });
        metaHtml = `<div class="application-detail-meta">SUBMITTED ${attrEsc(when.toUpperCase())}</div>`;
      }
    }

    if (fields.length === 0) {
      return metaHtml + `<div class="application-detail-empty">No relevant fields found in this submission.</div>`;
    }

    return metaHtml + fields.map(renderApplicationField).join("");
  }

  function renderApplicationField(field) {
    const label = field.label || "";
    let valueHtml = "";

    if ((field.type || "").toLowerCase() === "control_fileupload" && Array.isArray(field.value)) {
      valueHtml = field.value.map(url =>
        `<a href="${attrEsc(url)}" target="_blank" rel="noopener" class="application-field-file">VIEW</a>`
      ).join("");
      if (!valueHtml) valueHtml = `<span class="application-field-value is-no">—</span>`;
      return `
        <div class="application-field">
          <div class="application-field-label">${attrEsc(label)}</div>
          <div class="application-field-value">${valueHtml}</div>
        </div>
      `;
    }

    const raw = field.value == null ? "" : String(field.value).trim();
    const isYes = /^yes$/i.test(raw);
    const isNo = /^no$/i.test(raw);
    const cls = isYes ? "is-yes" : (isNo ? "is-no" : "");
    valueHtml = `<span class="application-field-value ${cls}">${attrEsc(raw || "—")}</span>`;

    return `
      <div class="application-field">
        <div class="application-field-label">${attrEsc(label)}</div>
        <div class="application-field-value">${valueHtml}</div>
      </div>
    `;
  }

  // ----- Teacher tab: full-application popup -----
  // Shows EVERY answered field from the student's Jotform application
  // submission in a modal. Reuses the same get-application-data endpoint
  // as the Trip Leader inline expand, but renders the full ordered list of
  // fields rather than the medical-focused whitelist.
  async function openApplicationModal(email, name, tripLeaderOnly) {
    const modal = document.getElementById("appModal");
    const subject = document.getElementById("appModalSubject");
    const body = document.getElementById("appModalBody");
    const titleEl = document.getElementById("appModalTitle");
    if (!modal || !body) return;

    if (titleEl) titleEl.textContent = tripLeaderOnly ? "MEDICAL INFORMATION" : "APPLICATION INFORMATION";
    if (subject) subject.textContent = name || "";
    body.innerHTML = `<div class="application-detail-empty">LOADING APPLICATION…</div>`;
    modal.hidden = false;
    document.body.style.overflow = "hidden";

    if (!email) {
      body.innerHTML = `<div class="application-detail-empty">No email on this student record.</div>`;
      return;
    }

    try {
      const res = await fetch(`/.netlify/functions/get-application-data?email=${encodeURIComponent(email)}`);
      if (!res.ok) {
        const text = await res.text().catch(() => "");
        let detail = `HTTP ${res.status}`;
        if (text) {
          // Try to pull a JSON error message; fall back to first 200 chars.
          try {
            const j = JSON.parse(text);
            if (j && (j.error || j.details)) detail += `: ${j.error || ""}${j.details ? ` — ${j.details}` : ""}`;
          } catch (_) {
            detail += `: ${text.slice(0, 200)}`;
          }
        }
        body.innerHTML = `<div class="application-detail-empty">Could not load application details.<br><small style="color:#999; font-size:11px;">${attrEsc(detail)}</small></div>`;
        return;
      }
      const data = await res.json();
      body.innerHTML = renderFullApplicationDetails(data, !!tripLeaderOnly);
    } catch (err) {
      console.error("Application modal fetch error:", err);
      body.innerHTML = `<div class="application-detail-empty">Could not load application details.<br><small style="color:#999; font-size:11px;">${attrEsc(err.message || String(err))}</small></div>`;
    }
  }

  function closeApplicationModal() {
    const modal = document.getElementById("appModal");
    if (modal) modal.hidden = true;
    document.body.style.overflow = "";
  }

  // ESC closes the modal
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      const modal = document.getElementById("appModal");
      if (modal && !modal.hidden) closeApplicationModal();
    }
  });

  function renderFullApplicationDetails(data, tripLeaderOnly) {
    if (!data || data.error) {
      return `<div class="application-detail-empty">Could not load application details${data?.error ? `: ${attrEsc(data.error)}` : ""}.</div>`;
    }
    if (!data.found) {
      return `<div class="application-detail-empty">No application form submission found for this email.</div>`;
    }

    let fields = Array.isArray(data.fields) ? data.fields : [];
    if (tripLeaderOnly) {
      // Trip leader view: only the medical / health / passport / dietary
      // whitelist (defined in TRIP_LEADER_APPLICATION_FIELDS near the top).
      fields = fields.filter(f => TRIP_LEADER_APPLICATION_FIELDS.has(f.label));
    }

    let metaHtml = "";
    if (data.submittedAt) {
      const d = new Date(data.submittedAt);
      if (!isNaN(d.getTime())) {
        const when = d.toLocaleDateString("en-NZ", { year: "numeric", month: "short", day: "numeric" });
        metaHtml = `<div class="app-modal-meta">SUBMITTED ${attrEsc(when.toUpperCase())}</div>`;
      }
    }

    if (fields.length === 0) {
      return metaHtml + `<div class="application-detail-empty">No relevant fields found in this submission.</div>`;
    }

    return metaHtml + fields.map(renderFullApplicationField).join("");
  }

  function renderFullApplicationField(field) {
    const label = field.label || "";
    const t = String(field.type || "").toLowerCase();

    // File-upload fields → list of VIEW links routed through the
    // /document-proxy edge function so they don't require a Jotform login
    // and aren't capped at 6MB (passport scans, medical PDFs etc. routinely
    // run 4–10MB; the edge function streams up to ~20MB).
    if (t === "control_fileupload" && Array.isArray(field.value)) {
      const links = field.value
        .filter(Boolean)
        .map(url => `<a href="/document-proxy?url=${encodeURIComponent(url)}" target="_blank" rel="noopener" class="application-field-file">VIEW</a>`)
        .join("");
      return `
        <div class="application-field">
          <div class="application-field-label">${attrEsc(label)}</div>
          <div class="application-field-value">${links || '<span class="application-field-value is-no">—</span>'}</div>
        </div>
      `;
    }

    const raw = field.value == null ? "" : String(field.value).trim();
    const isYes = /^yes$/i.test(raw);
    const isNo = /^no$/i.test(raw);
    const cls = isYes ? "is-yes" : (isNo ? "is-no" : "");
    const valueHtml = `<span class="application-field-value ${cls}">${attrEsc(raw || "—")}</span>`;
    return `
      <div class="application-field">
        <div class="application-field-label">${attrEsc(label)}</div>
        <div class="application-field-value">${valueHtml}</div>
      </div>
    `;
  }

  function styleLinksAsButtons() {
    const links = document.querySelectorAll("#content a:not(.event-link):not(.flight-link):not(.payment-btn):not(.payment-amount-link):not(.manual-link):not(.teacher-contact a)");
    const colors = ["#5b7f9e", "#59a1aa", "#a9a66e", "#d6a380"];

    let buttonIndex = 0;
    links.forEach((link) => {
      const href = (link.getAttribute("href") || "").trim();
      // Leave email/phone/anchor links alone — they're contact actions or
      // in-page jumps, not navigation buttons.
      if (/^(mailto:|tel:|sms:|#)/i.test(href)) return;

      link.classList.add("portal-btn");
      if (buttonIndex === 0) {
        link.style.background = "#e8694a";
      } else {
        link.style.background = colors[(buttonIndex - 1) % colors.length];
      }
      buttonIndex++;

      if (link.href && email) {
        try {
          const url = new URL(link.href);
          url.searchParams.set("email", email);
          link.href = url.toString();
        } catch(e) {}
      }
    });
  }

  function applyVisibility(labels = []) {
    console.log("LABELS:", labels);
    console.log("TRIP LEADER CHECK:", labels.includes("Trip Leader"));
    console.log("RAW LABELS JSON:", JSON.stringify(labels));

    if (!labels.includes("Parent") && !labels.includes("Student")) {
      document.getElementById("familyTile").style.display = "none";
    }

    if (!labels.includes("Trip Leader")) {
      document.getElementById("tripLeaderTile").style.display = "none";
    }

    if (!labels.includes("Teacher")) {
      document.getElementById("teacherTile").style.display = "none";
    }
  }

  function logout() {
    sessionStorage.removeItem("portalEmail");
    sessionStorage.removeItem("adminRole");
    sessionStorage.removeItem("firstName");
    window.location.href = "/login.html";
  }

  // Admin viewing banner — sits at the top of the page when an admin is
  // viewing a trip via /admin.html. Has a back-link home + a "read-only"
  // notice. Rendered once at init time.
  function renderAdminBanner() {
    if (document.getElementById("adminBanner")) return;
    const div = document.createElement("div");
    div.id = "adminBanner";
    div.style.cssText = "background:#2d6b74; color:white; padding:10px 18px; display:flex; align-items:center; gap:14px; font-size:12px; letter-spacing:1.2px;";
    div.innerHTML = `
      <span style="font-weight:600;">ADMIN VIEW</span>
      <span style="opacity:0.85;">You are viewing this trip as an administrator.</span>
      <a href="/admin.html" style="margin-left:auto; color:white; text-decoration:underline; font-weight:600;">← BACK TO ADMIN HOME</a>
    `;
    document.body.insertBefore(div, document.body.firstChild);
  }

  function showInstallPrompt() {
    const sheet = document.getElementById("installSheet");
    const text = document.getElementById("installSheetText");
    const dismissed = sessionStorage.getItem("installDismissed");

    if (dismissed) return;

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isAndroid = /android/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches;

    if (isStandalone) return;

    if (isIOS) {
      text.textContent = "Tap the share button at the bottom of your browser, then tap 'Add to Home Screen' to install the Unearthed portal as an app.";
    } else if (isAndroid) {
      text.textContent = "Tap the menu button in your browser, then tap 'Add to Home Screen' to install the Unearthed portal as an app.";
    } else {
      return;
    }

    sheet.style.display = "block";
    setTimeout(() => sheet.classList.add("visible"), 50);
  }

  function dismissSheet() {
    const sheet = document.getElementById("installSheet");
    sheet.classList.remove("visible");
    setTimeout(() => sheet.style.display = "none", 300);
    sessionStorage.setItem("installDismissed", "true");
  }

  init();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js");
  }
</script>

</body>
